# =============================================================================
# Apache security hardening — GBO production image
# Di-enable via: a2enconf gbo-hardening
# =============================================================================

# --- HTTP TRACE/TRACK (OWASP / CIS) — WAJIB Off untuk lulus security scan ---
TraceEnable Off

# --- Batasi ukuran request body (20 MB) ---
LimitRequestBody 20971520

# --- Timeout & keep-alive ---
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# --- Kurangi information disclosure via ETag ---
FileETag None

# --- Sembunyikan banner server tambahan ---
<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always unset Server
    # Legacy scanner sering cek header ini:
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</IfModule>

# --- Blokir akses file sensitif (backup .htaccess di image) ---
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "\.(env|sql|bak|old|log|key|pem|crt|pfx|sh|ini|conf|git|md)$">
    Require all denied
</FilesMatch>

# --- Hardening khusus document root ---
<Directory /var/www/html>
    # Blokir HTTP verb berbahaya (TRACE sudah Off via TraceEnable)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} !^(GET|POST|HEAD|OPTIONS)$ [NC]
        RewriteRule .* - [F,L]
    </IfModule>
</Directory>

# --- Blokir direktori internal aplikasi jika ter-expose ---
<DirectoryMatch "^/var/www/html/(application|system|vendor|gct-gbo|BAK|BAK2|docker)(/|$)">
    Require all denied
</DirectoryMatch>

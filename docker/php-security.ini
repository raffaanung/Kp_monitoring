; =============================================================================
; PHP hardening — production (CIS / OWASP container baseline)
; =============================================================================
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; Login/reCAPTCHA memakai file_get_contents ke HTTPS
allow_url_fopen = On
allow_url_include = Off

; Output buffering — WAJIB On.
; Image php:apache resmi tidak memasang php.ini, jadi default output_buffering=Off.
; Tanpa buffer, 1 byte output nyasar (mis. BOM di file hook) mengunci header
; sehingga Set-Cookie session tidak pernah terkirim (login gagal di OpenShift,
; padahal normal di XAMPP yang output_buffering=4096).
output_buffering = 4096

; Session
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On
session.use_only_cookies = On
session.cookie_samesite = Lax
session.use_trans_sid = Off

; Upload / execution limits
max_execution_time = 120
max_input_time = 60
memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 10M
max_file_uploads = 5

; Dangerous functions (shell, code execution, ini leak)
; putenv TIDAK di-disable — dipakai app.php untuk load .env
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,parse_ini_file,show_source,phpinfo,dl

; Hardening lain
zend.assertions = -1
assert.active = Off
file_uploads = On
